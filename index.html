<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vegårstue | Vedfyrt privat badstue på Vegårshei</title>
<meta name="description" content="Lei en koselig, vedfyrt privat badstue i Vegårshei. Ferdig oppvarmet ved ankomst.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.vegårstue.no/ge/png" sizes="32x32" href="/favicon-32"5d6e;--bg:#f5f7fa;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#333}
header{background:var(--primary);color:#fff;text-align:center;padding:2.5rem 1rem}
main{max-width:820px;margin:auto;padding:1rem}
.card{background:var(--card);border-radius:12px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 4px 14px rgba(0,0,0,.05)}
h2{margin-top:0;color:var(--primary)}

/* GALLERY */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.gallery{grid-template-columns:repeat(2,1fr)}}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:pointer}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999}
.lightbox.open{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:10px}
.lb-close,.lb-prev,.lb-next{position:absolute;color:#fff;font-size:2.5rem;cursor:pointer;user-select:none}
.lb-close{top:16px;right:20px}
.lb-prev{left:20px;top:50%;transform:translateY(-50%)}
.lb-next{right:20px;top:50%;transform:translateY(-50%)}

/* FAQ */
.faq-item{border-bottom:1px solid #e5e7eb;padding:.8rem 0}
.faq-question{display:flex;justify-content:space-between;cursor:pointer;font-weight:600}
.faq-answer{max-height:0;overflow:hidden;transition:max-height .25s ease;color:#555}
.faq-item.open .faq-answer{max-height:800px}

/* FOOTER */
footer{text-align:center;padding:1rem;color:#777;font-size:.9rem}
.footer-link{text-decoration:none;color:inherit;border-bottom:1px dotted}
.footer-link:hover{transform:scale(1.05)}

/* MAINTENANCE */
.maintenance-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10000}
.maintenance-modal.open{display:flex}
.maintenance-box{background:#fff;padding:1.8rem;border-radius:14px;max-width:420px;text-align:center}
</style>
</head>

<body>

<header>
  <h1>Vegårstue – Vedfyrt privat badstue på Vegårshei</h1>
  <p>Badstue mellom fjell og fjord</p>
</header>

<main>

<div class="card">
<h2>🖼️ Bilder</h2>
<div class="gallery">
  <img src="vegårshei-badstue-01g src="vegårshei2.jpg
  <img src="vegårshei-badstue-03årshei-badstue-04.jpg
  <img src="vegårshei5.jpg
  <img src="vegårshei-badstue-iv>
</div>

<div class="card">
<h2>❓ Ofte stilte spørsmål</h2>

<div class="faq-item">
  <div class="faq-question">Må jeg ha på badetøy? <span>＋</span></div>
  <div class="faq-answer">Det bestemmer du helt selv.</div>
</div>

<div class="faq-item">
  <div class="faq-question">Er det dusj? <span>＋</span></div>
  <div class="faq-answer">Ja, kaldtvannsdusj bak badstuen.</div>
</div>

</div>

</main>

<footer>
© 2026 Vegårstue •
<a class="footer-link" href="https://vanderlindenno.github.io/fjordsauna/webdesign.html/footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
<span class="lb-close" id="lbClose">✕</span>
<span class="lb-prev" id="lbPrev">❮</span>
<img id="lbImage">
<span class="lb-next" id="lbNext">❯</span>
</div>

<!-- MAINTENANCE -->
<div class="maintenance-modal" id="maintenanceModal">
<div class="maintenance-box">
  <h2>ℹ️ Midlertidig stengt</h2>
  <p>Badstuen er midlertidig stengt.</p>
  <button id="maintenanceClose">Lukk</button>
</div>
</div>

<script>
/* FAQ */
document.querySelectorAll('.faq-question').forEach(q=>{
q.onclick=()=>q.parentElement.classList.toggle('open')
})

/* LIGHTBOX */
document.addEventListener('DOMContentLoaded',()=>{
const imgs=[...document.querySelectorAll('.gallery img')]
const lb=document.getElementById('lightbox')
const lbImg=document.getElementById('lbImage')
const lbClose=document.getElementById('lbClose')
const lbPrev=document.getElementById('lbPrev')
const lbNext=document.getElementById('lbNext')
let i=0

function show(n){
i=(n+imgs.length)%imgs.length
lbImg.src=imgs[i].src
}

imgs.forEach((img,idx)=>{
img.onclick=()=>{show(idx);lb.classList.add('open')}
})

lbClose.onclick=()=>lb.classList.remove('open')
lbPrev.onclick=()=>show(i-1)
lbNext.onclick=()=>show(i+1)

document.addEventListener('keydown',e=>{
if(!lb.classList.contains('open'))return
if(e.key==='Escape')lb.classList.remove('open')
if(e.key==='ArrowRight')show(i+1)
if(e.key==='ArrowLeft')show(i-1)
})
})

/* MAINTENANCE */
const MAINTENANCE_MODE=true
const modal=document.getElementById('maintenanceModal')
const closeBtn=document.getElementById('maintenanceClose')
if(MAINTENANCE_MODE)modal.classList.add('open')
closeBtn.onclick=()=>modal.classList.remove('open')
</script>

</body>
</html>
